name: Windows Native Build (MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Tell vcpkg where to store and look for compiled binaries
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup the cache for vcpkg's binary output
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          # This key creates a unique cache ID based on the OS and the dependencies requested
          key: ${{ runner.os }}-vcpkg-cache

      - name: Install Dependencies via vcpkg
        # vcpkg will automatically use the cache folder defined in the env above
        run: vcpkg install openssl:x64-windows libxml2:x64-windows zlib:x64-windows

      - name: Configure CMake (HelelaniRover)
        # We dropped the invasive CMAKE_TOOLCHAIN_FILE and replaced it with a simple CMAKE_PREFIX_PATH
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="C:/vcpkg/installed/x64-windows" -DCMAKE_BUILD_TYPE=RelWithDebInfo
        env:
          PKG_CONFIG_PATH: "C:/vcpkg/installed/x64-windows/lib/pkgconfig"

      - name: Build the Project
        run: cmake --build build --config RelWithDebInfo --target client_saucer

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: HelelaniRover-Windows-Binaries
          # We grab everything in the Release folders (including dynamic .dll files vcpkg might bundle)
          path: |
            build/client/RelWithDebInfo/*
            build/rover/RelWithDebInfo/*
            build/rover/RelWithDebInfo/*.dll