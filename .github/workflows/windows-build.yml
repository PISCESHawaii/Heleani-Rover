name: Windows Native Build (MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies via vcpkg
        # Downloads Microsoft's pre-compiled versions of the supporting libraries
        run: vcpkg install openssl:x64-windows libxml2:x64-windows zlib:x64-windows

      - name: Configure CMake (HelelaniRover)
        # We tell CMake to use vcpkg as the toolchain, which automatically wires up find_package()
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release

      - name: Build the Project
        run: cmake --build build --config Release

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: HelelaniRover-Windows-Binaries
          # We grab everything in the Release folders (including dynamic .dll files vcpkg might bundle)
          path: |
            build/client/Release/*
            build/rover/Release/*
            build/rover/Release/*.dll